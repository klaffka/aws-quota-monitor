target-version = "py314"

[lint]
# Correctness first, widened in stages and only where the whole repository was
# already clean or a handful of edits away. Each group below was counted before
# being switched on, so turning one on never meant a repository-wide rewrite.
#
# Deliberately left off, with their current violation counts:
#   E501 (2562) line length, a pure re-wrapping diff
#   I    (206)  import sorting, mechanical churn across ~190 files
#   C4   (590)  and ARG (178), EM/TRY (~1080 each): one uniform idiom repeated
#               across the 227 check modules, so the count measures the shape of
#               the codebase rather than a defect
#   Q    (47k)  the repository uses single quotes; ruff's default is double
select = [
    "E9", "F", "W",      # syntax, undefined names, unused imports, whitespace
    "B", "SIM", "RET",    # likely bugs and needless indirection
    "UP", "RUF", "ISC",   # outdated idioms and hidden string concatenation
    "TID", "ICN", "PIE", "A",
]

[lint.per-file-ignores]
# The suite redefines fixtures and helpers on purpose.
"tests/*" = ["F811"]
