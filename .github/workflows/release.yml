name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Required CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish GitHub release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Validate tag and release notes
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/release.py check-tag "$RELEASE_TAG"
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Download validated Lambda layer
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: lambda-layer
          path: dist
      - name: Prepare release assets
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mv dist/lambda_layer.zip "dist/aws-quota-monitor-${RELEASE_VERSION}-lambda-layer.zip"
          python scripts/release.py notes "$RELEASE_VERSION" --output release-notes.md
          cd dist
          sha256sum "aws-quota-monitor-${RELEASE_VERSION}-lambda-layer.zip" > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/aws-quota-monitor-*-lambda-layer.zip \
            dist/SHA256SUMS \
            --verify-tag \
            --title "AWS Quota Monitor $RELEASE_TAG" \
            --notes-file release-notes.md
